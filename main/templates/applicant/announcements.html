{% extends 'applicant/layout.html' %}
{% block title %}Announcements{% endblock %}
{% block content %}
<h1 class="font-space text-3xl font-bold mb-6">Announcements</h1>
<div class="space-y-4">
    {% for a in announcements %}
    <article class="bg-white rounded-2xl p-5 border shadow-sm">
        <h2 class="font-semibold text-lg">{{ a.title }}</h2>
        <div class="text-xs text-slate-500 mb-2">{{ a.created_at|date:"F j, Y, g:i A" }}</div>
        <p class="whitespace-pre-line text-slate-700">{{ a.body }}</p>
    </article>
    {% empty %}
    <p class="text-slate-500">No announcements yet.</p>
    {% endfor %}
</div>
{% endblock %}
