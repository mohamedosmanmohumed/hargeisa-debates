{% extends 'base.html' %}
{% load static %}

{% block title %}Create Form - Hargeisa Debates{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-teal-50 via-white to-teal-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">
        <div class="mb-8">
            <a href="{% url 'form_list' %}" class="text-teal-600 dark:text-teal-400 hover:text-teal-700 dark:hover:text-teal-300 flex items-center space-x-2 mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back to Forms</span>
            </a>
            <h1 class="text-3xl sm:text-4xl font-bold font-space text-gray-900 dark:text-white mb-2">Create New Form</h1>
            <p class="text-gray-600 dark:text-gray-300">Give your form a title and description to get started</p>
        </div>

        <div class="glass p-8 rounded-2xl shadow-lg border-2 border-teal-500/20">
            <form method="post">
                {% csrf_token %}
                <div class="mb-6">
                    <label for="title" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Form Title *</label>
                    <input type="text" id="title" name="title" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-gray-700/50 backdrop-blur-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all hover:border-teal-500" placeholder="e.g., Civic Lab Cohort 2026 Application" required>
                </div>
                <div class="mb-6">
                    <label for="description" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Description</label>
                    <textarea id="description" name="description" rows="4" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-gray-700/50 backdrop-blur-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all resize-none hover:border-teal-500" placeholder="Provide a brief description of this form..."></textarea>
                </div>
                <div class="flex justify-end space-x-4">
                    <a href="{% url 'form_list' %}" class="px-6 py-3 border-2 border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-medium rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="px-6 py-3 bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-700 hover:to-teal-600 text-white font-semibold rounded-lg shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 hover:scale-105">
                        Create Form
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
